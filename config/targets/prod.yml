# Production environment deployment specs
targets:
  prod:
    mode: production
    workspace:
      host: https://dbc-c17268be-1c4c.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema_bronze: prod_bronze
      schema_silver: prod_silver
      schema_gold: prod_gold
    run_as:
      # Service principal for production deployments
      # user_name: service-principal@example.com
      service_principal_name: ${var.service_principal_name}
