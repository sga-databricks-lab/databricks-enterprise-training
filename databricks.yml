bundle:
  name: databricks-enterprise-training

include:
  - config/targets/*.yml

variables:
  catalog:
    description: Target Unity Catalog name
    default: workspace
  schema_bronze:
    description: Bronze target schema
    default: bronze
  schema_silver:
    description: Silver target schema
    default: silver
  schema_gold:
    description: Gold target schema
    default: gold

resources:
  pipelines:
    silver_dlt_pipeline:
      name: ${bundle.target}-silver-cleanse-pipeline
      catalog: ${var.catalog}
      target: ${var.schema_silver}
      continuous: true
      serverless: true
      libraries:
        - file:
            path: ./src/03_silver/cleanse_dlt_pipeline.py

    gold_aggregation_pipeline:
      name: ${bundle.target}-gold-aggregation-pipeline
      catalog: ${var.catalog}
      target: ${var.schema_gold}
      continuous: false
      serverless: true
      libraries:
        - file:
            path: ./src/04_gold/aggregate_metrics.py

  jobs:
    data_generator:
      name: ${bundle.target}-data-generator-job
      environments:
        - environment_key: serverless_env
          spec:
            client: "1"
      tasks:
        - task_key: generate_data
          environment_key: serverless_env
          spark_python_task:
            python_file: ./utils/data_generator.py
        - task_key: governance
          environment_key: serverless_env
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ./src/01_governance/dim_usr_masking.sql


    medallion_orchestrator:
      name: ${bundle.target}-medallion-pipeline-job
      environments:
        - environment_key: serverless_env
          spec:
            client: "1"
      tasks:
        - task_key: stream_simulator
          environment_key: serverless_env
          spark_python_task:
            python_file: ./utils/generate_new_batch.py

        - task_key: bronze_ingestion
          environment_key: serverless_env
          depends_on:
            - task_key: stream_simulator
          notebook_task:
            notebook_path: ./src/02_bronze/ingest_raw_events.py

        - task_key: silver_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_dlt_pipeline.id}
          depends_on:
            - task_key: bronze_ingestion

        - task_key: gold_aggregations
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_aggregation_pipeline.id}
          depends_on:
            - task_key: silver_pipeline

    backup_recovery:
      name: ${bundle.target}-backup-recovery-job
      environments:
        - environment_key: serverless_env
          spec:
            client: "1"
      tasks:
        - task_key: create_backups
          environment_key: serverless_env
          spark_python_task:
            python_file: ./src/04_gold/backup_recovery.py

    query_validation:
      name: ${bundle.target}-query-validation-job
      environments:
        - environment_key: serverless_env
          spec:
            client: "1"
      tasks:
        - task_key: run_benchmarks
          environment_key: serverless_env
          notebook_task:
            notebook_path: ./src/04_gold/query_benchmarking.py