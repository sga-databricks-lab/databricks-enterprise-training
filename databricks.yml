bundle:
  name: databricks-enterprise-training

include:
  - config/targets/*.yml

variables:
  environment:
    description: Environment name (dev, prod)
    default: dev
  catalog:
    description: Target Unity Catalog name (dev or prod)
    default: dev
  schema_bronze:
    description: Bronze target schema
    default: bronze
  schema_silver:
    description: Silver target schema
    default: silver
  schema_gold:
    description: Gold target schema
    default: gold
  warehouse_id:
    description: SQL Warehouse ID for SQL tasks
    default: ""
  service_principal_name:
    description: Service principal for production deployments
    default: ""

resources:
  pipelines:
    silver_dlt_pipeline:
      name: ${var.environment}-silver-cleanse-pipeline
      catalog: ${var.catalog}
      target: ${var.schema_silver}
      continuous: false
      serverless: true
      libraries:
        - file:
            path: ./src/03_silver/cleanse_dlt_pipeline.py

    gold_aggregation_pipeline:
      name: ${var.environment}-gold-aggregation-pipeline
      catalog: ${var.catalog}
      target: ${var.schema_gold}
      continuous: false
      serverless: true
      libraries:
        - file:
            path: ./src/04_gold/aggregate_metrics.py

  jobs:
    data_generator:
      name: ${var.environment}-data-generator-job
      # Notebook tasks automatically default to serverless when clusters are omitted.
      # Left blank as no environment blocks are required for standard .ipynb runs.
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./utils/data_generator.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema_bronze: ${var.schema_bronze}
        - task_key: governance
          depends_on:
            - task_key: generate_data
          sql_task:
            file:
              path: ./src/01_governance/dim_usr_masking.sql
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: ${var.catalog}
              schema_bronze: ${var.schema_bronze}

    medallion_orchestrator:
      name: ${var.environment}-medallion-pipeline-job
      environments:
        - environment_key: serverless_env
          spec:
            client: "1"
      tasks:
        - task_key: stream_simulator
          environment_key: serverless_env
          notebook_task:
            notebook_path: ./utils/generate_new_batch.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema_bronze: ${var.schema_bronze}

        - task_key: bronze_ingestion
          environment_key: serverless_env
          depends_on:
            - task_key: stream_simulator
          spark_python_task:
            python_file: ./src/02_bronze/ingest_raw_events.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema_bronze"
              - "${var.schema_bronze}"

        - task_key: silver_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_dlt_pipeline.id}
          depends_on:
            - task_key: bronze_ingestion

        - task_key: gold_aggregations
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_aggregation_pipeline.id}
          depends_on:
            - task_key: silver_pipeline

    backup_recovery:
      name: ${var.environment}-backup-recovery-job
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
      tasks:
        - task_key: create_backups
          environment_key: serverless_env
          spark_python_task:
            python_file: ./src/04_gold/backup_recovery.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema_bronze"
              - "${var.schema_bronze}"
              - "--schema_silver"
              - "${var.schema_silver}"
              - "--schema_gold"
              - "${var.schema_gold}"


    query_validation:
      name: ${var.environment}-query-validation-job
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
      tasks:
        - task_key: run_benchmarks
          environment_key: serverless_env
          # FIXED: Corrected task type mapping to spark_python_task for .py script 
          spark_python_task:
            python_file: ./src/04_gold/query_benchmarking.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema_bronze"
              - "${var.schema_bronze}"
              - "--schema_silver"
              - "${var.schema_silver}"
              - "--schema_gold"
              - "${var.schema_gold}"
